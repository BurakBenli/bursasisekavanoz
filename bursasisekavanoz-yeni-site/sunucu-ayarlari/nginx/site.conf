# nginx örnek sunucu bloğu – kendi alan adınıza ve klasörünüze göre düzenleyin.
# nginx 1.25.1 ve üzeri ("http2 on;"). Daha eski sürümde "listen 443 ssl http2;" yazın ve "http2 on;" satırlarını silin.
# http { } bloğuna (ya da conf.d altındaki bu dosyanın en üstüne):
map_hash_max_size 32768;
map_hash_bucket_size 128;
map $uri $ud_kod {
    default "";
    "~^/[^/]*-ud-(?<kod>[0-9]+)/?$" $kod;
}
map $ud_kod $ud_hedef {
    default "";
    include /etc/nginx/yonlendirmeler/ud.map;   # sunucu-ayarlari/nginx/ud.map dosyası
}

server {
    listen 80;
    listen [::]:80;
    server_name www.ornek-ambalaj.com ornek-ambalaj.com;
    return 301 https://www.ornek-ambalaj.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ornek-ambalaj.com;
    # ssl_certificate ...; ssl_certificate_key ...;
    return 301 https://www.ornek-ambalaj.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ornek-ambalaj.com;
    # ssl_certificate /etc/letsencrypt/live/www.ornek-ambalaj.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/www.ornek-ambalaj.com/privkey.pem;
    root /var/www/www.ornek-ambalaj.com/dist;
    index index.html;
    charset utf-8;
    server_tokens off;
    error_page 404 /404.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Eski sabit sayfalar
    location = /product-list { return 301 /urunler/; }
    location = /About/about { return 301 /hakkimizda/; }
    location = /About/contact { return 301 /iletisim/; }
    location = /About/distance-selling-contract { return 301 /mesafeli-satis-sozlesmesi/; }
    location = /About/cancel-return-exchange-policy { return 301 /iptal-iade-degisim-politikasi/; }
    location = /About/privacy-policy { return 301 /gizlilik-politikasi/; }
    location = /About/membership-contract { return 301 /uyelik-sozlesmesi/; }
    location = /About/bank-account { return 301 /banka-hesap-bilgileri/; }
    # Eski ürün adresleri (…-ud-1234)
    location ~ "^/[^/]*-ud-[0-9]+/?$" {
        if ($ud_hedef) { return 301 $ud_hedef; }
        return 301 /urunler/;
    }
    # Gizli dosyalar
    location ~ /\.(?!well-known/) { return 404; }
    location /eski/ { return 404; }

    location /assets/ {
        expires 1y;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
